name: 'Upload strings'
description: 'Uploads source strings to Lokalise for the current branch'
inputs:
  localization-file:
    description: The path to the source localization file.
    required: true
runs:
  using: "composite"
  steps:
  - uses: YousicianGit/LokaliseActions/install-cli@main
  - name: Install gettext
    run: sudo apt install gettext
    shell: bash
  - name: Update translatios
    run: |
      # Lokalise uses 'master' as the main branch for translations, so we replace github's 'main' with 'master'
      BRANCH="${{ github.head_ref || github.ref_name }}"
      if [ "$BRANCH" = "main" ]; then
        BRANCH="master"
      fi
      ${{ github.action_path }}/upload_strings.sh ${{ inputs.localization-file }} $BRANCH
    shell: bash
