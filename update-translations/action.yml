name: 'Update translations'
description: 'Updates translations from Lokalise for the current branch'
inputs:
  localization-directory:
    description: The path to the localization directory. This should have directories inside for each language.
    required: true
  use-async:
    description: Use async mode for file download. Recommended for large projects with many translations. Required for projects with >= 10,000 key-language pairs.
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
  - uses: YousicianGit/LokaliseActions/install-cli@main
  - name: Update translations
    run: |
      ASYNC_FLAG=""
      if [ "${{ inputs.use-async }}" = "true" ]; then
        ASYNC_FLAG="--async"
      fi
      # Lokalise uses 'master' as the main branch for translations, so we replace github's 'main' with 'master'
      BRANCH="${{ github.head_ref || github.ref_name }}"
      if [ "$BRANCH" = "main" ]; then
        BRANCH="master"
      fi
      ${{ github.action_path }}/update_translations.sh ${{ inputs.localization-directory }} \
      --branch $BRANCH \
      --stage-changes \
      --unreviewed \
      $ASYNC_FLAG
    shell: bash
  - name: Check for changes to commit
    id: check_changes
    run: git diff --name-only --cached --quiet # Returns 1 if there are staged changes
    continue-on-error: true
    shell: bash
  - name: Commit
    if: steps.check_changes.outcome == 'failure'
    run: |
      git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
      commit -m "Updated translations" \
      --author="${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
    shell: bash
  - name: Push
    if: steps.check_changes.outcome == 'failure'
    run: git push origin
    shell: bash
